# Website only (API on a different domain, e.g. api.yourdomain.com).
# Build with VITE_API_URL=https://api.yourdomain.com (CORS is open on the backend,
# so no extra settings are needed).
server {
    listen 80;
    server_name crm.yourdomain.com;
    root /var/www/harbour-web;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
